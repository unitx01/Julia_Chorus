# Builds the Caesar Chorus plugin on GitHub's Windows and Mac machines.
# Runs on every push, or manually from the Actions tab ("Run workflow").
name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: cmake -B build
          - name: Mac
            os: macos-latest
            # Universal build: runs on both Apple Silicon and Intel Macs
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure (downloads JUCE)
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: CaesarChorus-${{ matrix.name }}
          path: |
            build/CaesarChorus_artefacts/Release/VST3
            build/CaesarChorus_artefacts/Release/AU
            build/CaesarChorus_artefacts/Release/Standalone
          if-no-files-found: error
